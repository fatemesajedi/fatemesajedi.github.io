<header class="site-header">
  <div class="container nav">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-burger" aria-label="Menu"><span></span></label>
    <nav class="nav-links">
      {% for item in site.data.navigation %}
        {% assign active = false %}
        {% if item.url == '/' %}
          {% if page.url == '/' %}{% assign active = true %}{% endif %}
        {% elsif page.url contains item.url %}
          {% assign active = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}" class="{% if active %}active{% endif %}{% if item.url contains '#' %} nav-cta{% endif %}">{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
