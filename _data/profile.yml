bio: |
  Hello, I am Fateme. I am a PhD student at the EFMLab with a background in mechanical engineering.

  My current research focuses on **mixing in porous media**, where I investigate the crucial role that **scale** plays in mixing and mixing-driven reactions. My work uses and develops both **numerical simulations** and **microfluidics experiments**.
interests:
  - Mixing in porous media
  - Mixing-driven reactions
  - Scale effects
  - Microfluidics
  - Numerical simulation
