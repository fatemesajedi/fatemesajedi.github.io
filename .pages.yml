# Control panel configuration for Pages CMS (https://app.pagescms.org)
media:
  - name: images
    label: Photos & GIFs
    input: assets/images
    output: /assets/images
    categories: [image]
  - name: media
    label: Videos & PDFs
    input: assets/media
    output: /assets/media
    categories: [video, document]
  - name: files
    label: PDFs
    input: assets/files
    output: /assets/files
    categories: [document]

content:
  # ---------- Profile / About ----------
  - name: profile
    label: About me (profile)
    type: file
    path: _data/profile.yml
    format: yaml
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: role, label: Position, type: string, description: "e.g. PhD Student" }
      - { name: lab, label: Lab, type: string }
      - { name: institution, label: University / Institution, type: string }
      - { name: photo, label: Profile photo, type: image, options: { media: images } }
      - { name: bio, label: Bio, type: text, description: "Use **double asterisks** for bold. Leave an empty line between paragraphs." }
      - { name: interests, label: Research interests, type: string, list: true }
      - name: fun_facts
        label: "When I'm not in the lab… (fun facts)"
        type: object
        list: true
        fields:
          - { name: emoji, label: Emoji (shown on the map pin), type: string, description: "One emoji, e.g. 🧗 🎬 🍳 (Windows: press Win + . to open the emoji picker)" }
          - { name: text, label: Text, type: string }
          - { name: photo, label: Photos (optional), type: image, options: { media: images, multiple: true }, description: "Shown as a polaroid; several photos become a little slideshow. Landscape photos look best." }
      - { name: say_hi, label: "'Say hi' message", type: text, description: "Friendly invitation shown at the bottom of the home page" }
      - { name: email, label: Email, type: string }
      - { name: cv, label: CV (PDF), type: file, options: { media: files } }
      - { name: highlight_name, label: Name to bold in author lists, type: string, description: "Usually your surname" }
      - name: links
        label: Profile links (paste full URLs)
        type: object
        fields:
          - { name: google_scholar, label: Google Scholar, type: string }
          - { name: orcid, label: ORCID, type: string }
          - { name: researchgate, label: ResearchGate, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: github, label: GitHub, type: string }
      - name: education
        label: Education (shown on CV page)
        type: object
        list: true
        fields:
          - { name: degree, label: Degree, type: string }
          - { name: field, label: Field, type: string }
          - { name: place, label: University, type: string }
          - { name: years, label: Years, type: string, description: "e.g. 2023 – present" }

  # ---------- Conferences ----------
  - name: conferences
    label: Conferences & Events
    type: collection
    path: _conferences
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, location]
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Conference name, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: end_date, label: End date (optional), type: date, description: "For events lasting several days" }
      - { name: location, label: Location, type: string, description: "e.g. Paris, France" }
      - name: role
        label: My participation
        type: select
        options:
          values: [Talk, Poster, Invited talk, Workshop, Summer school, Attendee, Organizer]
      - { name: contribution, label: Talk / poster title, type: string }
      - { name: website, label: Conference website, type: string }
      - { name: cover, label: Cover photos, type: image, options: { media: images, multiple: true }, description: "The first one is shown on the card; all of them as a slideshow on the event page" }
      - { name: gallery, label: "Gallery: photos & GIFs", type: image, options: { media: images, multiple: true } }
      - { name: videos, label: "Gallery: videos & PDFs", type: file, options: { media: media, multiple: true } }
      - { name: body, label: My story / memories, type: rich-text }
      - name: sections
        label: "Sections (title + description + photos, GIFs or videos)"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Description, type: rich-text }
          - { name: media, label: "Photos & GIFs", type: image, options: { media: images, multiple: true } }
          - { name: videos, label: "Videos & PDFs", type: file, options: { media: media, multiple: true } }

  # ---------- Publications ----------
  - name: publications
    label: Publications
    type: collection
    path: _publications
    filename: "{year}-{primary}.md"
    view:
      fields: [title, year, type]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: authors, label: Authors, type: string, description: "e.g. F. Sajedi, A. Author, B. Author" }
      - { name: venue, label: Journal / conference, type: string }
      - { name: year, label: Year, type: number, required: true }
      - name: type
        label: Type
        type: select
        options:
          values: [Journal article, Conference paper, Conference abstract, Poster, Preprint, Thesis, Other]
      - { name: status, label: Status, type: string, description: "Optional, e.g. Under review, In preparation" }
      - { name: doi, label: DOI, type: string, description: "Only the DOI, e.g. 10.1029/2024WR012345" }
      - { name: pdf, label: PDF file, type: file, options: { media: files } }
      - { name: link, label: Other link, type: string }
      - { name: code, label: Code / data link, type: string }

  # ---------- Research projects ----------
  - name: projects
    label: Research projects
    type: collection
    path: _projects
    view:
      fields: [title, order]
    fields:
      - { name: title, label: Project title, type: string, required: true }
      - { name: summary, label: Short summary, type: text, description: "1–2 sentences for the Research page" }
      - { name: order, label: Order on page, type: number, description: "1 = first" }
      - { name: image, label: Main images (GIFs work too!), type: image, options: { media: images, multiple: true }, description: "The first one is shown on the Research page; all of them as a slideshow on the project page" }
      - { name: video, label: Main video, type: string, description: "Paste a YouTube/Vimeo link, or the path of an uploaded video (e.g. /assets/media/flow.mp4). Shown instead of the main image." }
      - { name: media, label: "Gallery: photos & GIFs", type: image, options: { media: images, multiple: true } }
      - { name: videos, label: "Gallery: videos & PDFs", type: file, options: { media: media, multiple: true } }
      - { name: methods, label: Methods / tags, type: string, list: true }
      - { name: body, label: Full description, type: rich-text }
      - name: sections
        label: "Sections (title + description + photos, GIFs or videos)"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Description, type: rich-text }
          - { name: media, label: "Photos & GIFs", type: image, options: { media: images, multiple: true } }
          - { name: videos, label: "Videos & PDFs", type: file, options: { media: media, multiple: true } }

  # ---------- News ----------
  - name: news
    label: News (home page)
    type: collection
    path: _news
    filename: "{year}-{month}-{day}-news.md"
    view:
      fields: [date, body]
    fields:
      - { name: date, label: Date, type: date, required: true }
      - { name: body, label: News text, type: rich-text, description: "One or two sentences" }

  # ---------- Home page texts ----------
  - name: home
    label: Home page texts
    type: file
    path: _data/home.yml
    format: yaml
    fields:
      - name: banner
        label: Banner (the 3 animations at the top)
        type: object
        fields:
          - name: mixing
            label: "1 · Mixing"
            type: object
            fields:
              - { name: title, label: Tab name, type: string }
              - { name: caption, label: Caption, type: text }
          - name: reaction
            label: "2 · Reaction hotspots"
            type: object
            fields:
              - { name: title, label: Tab name, type: string }
              - { name: caption, label: Caption, type: text }
          - name: dissolution
            label: "3 · Rock dissolution"
            type: object
            fields:
              - { name: title, label: Tab name, type: string }
              - { name: caption, label: Caption, type: text }
      - name: research_30s
        label: My research in 30 seconds (with the coffee cup)
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: text, label: Text, type: text, description: "Plain language! Use **double asterisks** for bold, and an empty line between paragraphs." }
          - { name: link_text, label: Link to the Research page, type: string }
          - { name: cup_hint, label: Hint on the cup, type: string }
          - { name: cup_caption, label: Caption under the cup, type: text }
      - name: gallery
        label: "From the lab (gallery slideshow)"
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: link_text, label: Link to the Gallery page, type: string }
      - name: heroes
        label: "My equation heroes (card next to the intro)"
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle (optional), type: string, description: "Small italic line under the heading, e.g. on whose shoulders I stand. Leave empty to hide it." }
          - name: list
            label: Heroes
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string }
              - { name: years, label: Years, type: string, description: "e.g. 1785–1836" }
              - { name: photo, label: Portrait, type: image, options: { media: images } }
              - { name: equation, label: Equation (LaTeX), type: string, description: 'LaTeX without dollar signs, e.g. \mathbf{q} = -\frac{k}{\mu}\nabla p' }
              - { name: fact, label: Fun fact, type: text }
              - { name: use, label: Where I use it, type: text }
          - { name: credit, label: Image credit, type: string }
      - name: lesson
        label: "Let's learn mixing together (the droplets)"
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: step1_title, label: "Step 1 · title", type: string }
          - { name: step1_text, label: "Step 1 · text", type: text }
          - { name: step1_button, label: "Step 1 · button", type: string }
          - { name: step2_title, label: "Step 2 · title", type: string }
          - { name: step2_text, label: "Step 2 · text", type: text }
          - { name: step2_limit, label: "Step 2 · message when stirring reaches ×100", type: text }
          - { name: step2_button, label: "Step 2 · button", type: string }
          - { name: step3_title, label: "Step 3 · title", type: string }
          - { name: step3_text, label: "Step 3 · text", type: text }
          - { name: step3_button, label: "Step 3 · button", type: string }
          - { name: step4_title, label: "Step 4 · title", type: string }
          - { name: step4_text, label: "Step 4 · text", type: text }
          - { name: references, label: References, type: text, description: "One reference per paragraph (empty line between them). *Asterisks* make italics." }

  # ---------- Gallery (scientific images) ----------
  - name: gallery
    label: Gallery (science images)
    type: collection
    path: _gallery
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, kind, date]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: images, label: "Photos & GIFs", type: image, options: { media: images, multiple: true }, description: "Upload new ones, or Select one you already uploaded for a project or publication." }
      - { name: videos, label: "Videos & PDFs", type: file, options: { media: media, multiple: true } }
      - name: kind
        label: Type
        type: select
        options:
          values: [Experiment, Simulation, Other]
      - { name: caption, label: Caption, type: text, description: "One or two sentences: what are we looking at?" }
      - { name: date, label: Date, type: date, required: true, description: "Newest images are shown first" }
      - { name: link, label: Link (optional), type: string, description: "Page with more details, e.g. /research/microfluidics-experiments/ or a paper's DOI link" }
      - { name: home, label: Show in the home page slideshow, type: boolean, default: true }
