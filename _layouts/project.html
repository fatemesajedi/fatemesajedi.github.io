---
layout: default
---
<article class="entry">
  <a class="back" href="{{ '/research/' | relative_url }}">← All research</a>
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.summary and page.summary != "" %}<p class="lead">{{ page.summary }}</p>{% endif %}
  {% if page.image and page.image != "" %}
  <img class="cover" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  {% endif %}
  <div class="prose">{{ content }}</div>
</article>
